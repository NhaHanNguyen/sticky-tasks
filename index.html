<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <header class="topbar">

      <div class="brand">
        Sticky Tasks <span>• board</span>
      </div>

      <div class="composer-area">

        <form class="composer" id="noteForm">

          <label class="sr-only" for="taskInput">
            New task
          </label>

          <input
            id="taskInput"
            maxlength="160"
            autocomplete="off"
            placeholder="Write a task..."
          />

          <button class="add-btn" type="submit">
            + Add note
          </button>

        </form>

        <div
          class="color-picker"
          aria-label="Choose sticky note color"
        >

          <button
            class="color-dot selected"
            type="button"
            data-color="1"
            aria-label="Yellow note"
            aria-pressed="true"
          ></button>

          <button
            class="color-dot"
            type="button"
            data-color="2"
            aria-label="Orange note"
            aria-pressed="false"
          ></button>

          <button
            class="color-dot"
            type="button"
            data-color="3"
            aria-label="Green note"
            aria-pressed="false"
          ></button>

          <button
            class="color-dot"
            type="button"
            data-color="4"
            aria-label="Blue note"
            aria-pressed="false"
          ></button>

          <button
            class="color-dot"
            type="button"
            data-color="5"
            aria-label="Pink note"
            aria-pressed="false"
          ></button>

        </div>

      </div>

      <div class="topbar-right">

        <div class="trash-counter" aria-live="polite">

          <span class="counter-number" id="trashCount">
            0
          </span>

          <span class="counter-label">
            thrown away
          </span>

        </div>

        <div class="account-area">

          <button
            id="googleSignIn"
            class="google-sign-in"
            type="button"
          >
            <svg
              class="google-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M21.6 12.23c0-.71-.06-1.4-.18-2.07H12v3.92h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.34 2.98-7.38Z"
              />
              <path
                fill="#34A853"
                d="M12 22c2.7 0 4.98-.9 6.64-2.39l-3.24-2.51c-.9.6-2.05.96-3.4.96-2.61 0-4.82-1.76-5.61-4.13H3.05v2.59A10 10 0 0 0 12 22Z"
              />
              <path
                fill="#FBBC05"
                d="M6.39 13.93A6 6 0 0 1 6.08 12c0-.67.11-1.32.31-1.93V7.48H3.05A10 10 0 0 0 2 12c0 1.61.39 3.13 1.05 4.52l3.34-2.59Z"
              />
              <path
                fill="#EA4335"
                d="M12 5.94c1.47 0 2.79.51 3.83 1.5l2.87-2.87A9.62 9.62 0 0 0 12 2a10 10 0 0 0-8.95 5.48l3.34 2.59C7.18 7.7 9.39 5.94 12 5.94Z"
              />
            </svg>

            Sign in with Google
          </button>

          <div id="userMenu" class="user-menu hidden">

            <img
              id="userPhoto"
              class="user-photo"
              alt=""
              referrerpolicy="no-referrer"
            />

            <div class="user-info">

              <span id="userName" class="user-name"></span>

              <button
                id="signOutButton"
                class="sign-out-btn"
                type="button"
              >
                Sign out
              </button>

            </div>

          </div>

        </div>

      </div>

    </header>


    <section
      class="board"
      id="board"
      aria-label="Sticky note task board"
    >

      <div class="empty-state" id="emptyState">

        <div class="scribble">
          ✎
        </div>

        <strong>
          Your board is empty
        </strong>

        Add a task above, then press and hold a sticky note to pick it up and move it.

      </div>

      <div
        class="trash-wrap"
        id="trashWrap"
        aria-hidden="true"
      >

        <div class="trash-zone" id="trashZone">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
            <path d="M10 10v6" />
            <path d="M14 10v6" />
          </svg>

        </div>

        <div class="trash-label">
          Drop to delete
        </div>

      </div>

      <div
        class="toast"
        id="toast"
        role="status"
        aria-live="polite"
      ></div>

    </section>

  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
